#static-analysis-1 workflow

name: PMD Static Analysis on Push

on:
  push:
    branches: 
    - "**"

jobs:
  pmd-analysis:
    name: Run PMD
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Java
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: "11"

    - name: Install Maven
      run: |
        sudo apt-get update
        sudo apt-get install -y maven

    - name: Run PMD
      run: mvn pmd:pmd
