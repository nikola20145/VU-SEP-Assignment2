# Testing workflow
name: Testing
on:
  push:
    branches:
      - "**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v2

        - name: Set up Java
          uses: actions/setup-java@v2
          with:
            distribution: 'temurin'
            java-version: "11"
        - name: Install Maven
          run: |
            sudo apt-get update
            sudo apt-get install -y maven

        - name: Build using Maven
          run: mvn -B package --file pom.xml

        - name: Run tests
          run: mvn test
